# VPS: /etc/nginx/conf.d/backtest-data-source.conf
#
# This assumes frps binds proxied services to 127.0.0.1 via proxyBindAddr, so
# port 18768 is not directly reachable from the public Internet.

server {
    listen 80;
    server_name data.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name data.example.com;

    ssl_certificate /etc/letsencrypt/live/data.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/data.example.com/privkey.pem;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:18768;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
