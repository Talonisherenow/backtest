<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K-line Cache Viewer</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fa;
      --surface: #ffffff;
      --line: #dbe2e8;
      --text: #1f2933;
      --muted: #687782;
      --red: #d32f2f;
      --green: #00897b;
      --blue: #1565c0;
      --amber: #f9a825;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    }
    .topbar {
      display: block;
      padding: 16px 20px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }
    .topbar-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }
    .title-block {
      min-width: 0;
      flex: 1 1 auto;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0;
    }
    .subtitle {
      margin-top: 5px;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .header-actions {
      display: grid;
      justify-items: end;
      gap: 10px;
      flex: 0 0 auto;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: end;
      margin-top: 12px;
      max-width: 100%;
    }
    .data-status-button {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin-top: 12px;
      min-height: 40px;
      border: 1px solid #9dc5ff;
      border-radius: 6px;
      background: #eef6ff;
      color: var(--text);
      padding: 8px 12px;
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .data-status-button:hover {
      border-color: #6fa8ff;
      background: #e4f0ff;
    }
    .data-status-button strong {
      font-size: 13px;
      line-height: 1.2;
      white-space: nowrap;
    }
    .data-status-button span {
      color: var(--blue);
      font-size: 12px;
      line-height: 1.2;
      font-weight: 800;
      white-space: nowrap;
    }
    label {
      display: grid;
      gap: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }
    .control {
      min-width: 0;
    }
    .control-board {
      flex: 1 1 180px;
      max-width: 260px;
    }
    .control-symbol {
      flex: 1 1 260px;
      max-width: 360px;
    }
    .control-search {
      flex: 1 1 150px;
      max-width: 220px;
    }
    .control-frequency {
      flex: 0 1 auto;
      max-width: 100%;
    }
    select, input {
      min-height: 36px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 7px 9px;
      font: inherit;
      font-size: 14px;
    }
    .range {
      display: flex;
      width: max-content;
      max-width: 100%;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow-x: auto;
      background: #fff;
    }
    .range button {
      flex: 0 0 48px;
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      padding: 0 12px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }
    .range button:last-child { border-right: 0; }
    .range button.active {
      background: #e9f2ff;
      color: var(--blue);
      font-weight: 700;
    }
    .window-position {
      display: grid;
      grid-template-columns: minmax(140px, 1fr) minmax(190px, 260px);
      gap: 8px;
      align-items: center;
      min-width: 0;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      padding: 0 9px;
    }
    .window-position input {
      min-height: auto;
      padding: 0;
      border: 0;
    }
    .window-position span {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .time-window {
      display: grid;
      grid-template-columns: minmax(120px, 160px) minmax(94px, 116px) auto minmax(170px, 220px) auto minmax(330px, 1fr);
      gap: 10px;
      align-items: end;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .custom-indicator-panel {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }
    .custom-indicator-panel.compact {
      margin-top: 0;
      padding: 8px 10px;
      border-top: 0;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }
    .custom-indicator-panel.compact .custom-indicator-header {
      gap: 8px;
    }
    .custom-indicator-panel.compact .custom-indicator-title {
      gap: 6px;
    }
    .custom-indicator-panel.compact .custom-indicator-title strong {
      font-size: 12px;
    }
    .custom-indicator-panel.compact .custom-indicator-title span {
      font-size: 11px;
    }
    .custom-indicator-panel.compact .custom-indicator-form,
    .custom-indicator-panel.compact .custom-indicator-feedback,
    .custom-indicator-panel.compact .custom-indicator-templates,
    .custom-indicator-panel.compact .custom-indicator-list,
    .custom-indicator-panel.compact .custom-indicator-empty {
      margin-top: 6px;
    }
    .custom-indicator-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .custom-indicator-title {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .custom-indicator-title strong {
      font-size: 13px;
      line-height: 1.2;
    }
    .custom-indicator-title span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.2;
    }
    .custom-indicator-form {
      display: none;
      margin-top: 10px;
      grid-template-columns: minmax(180px, 240px) minmax(180px, 240px) auto;
      gap: 10px;
      align-items: end;
    }
    .custom-indicator-form.open {
      display: grid;
    }
    .custom-indicator-form textarea {
      min-height: 36px;
      height: 36px;
      resize: vertical;
    }
    .custom-indicator-form input {
      height: 36px;
    }
    .formula-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .formula-help {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border: 1px solid #9db2c7;
      border-radius: 50%;
      color: #6b7f93;
      font-size: 10px;
      font-weight: 700;
      line-height: 1;
      cursor: help;
      user-select: none;
      background: #fff;
    }
    .custom-indicator-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .custom-indicator-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .custom-indicator-templates {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .template-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border: 1px dashed #b8c7d6;
      border-radius: 999px;
      background: #f8fafc;
      color: var(--text);
      font: inherit;
      font-size: 12px;
      cursor: pointer;
    }
    .template-chip:hover {
      border-color: #6fa8ff;
      background: #eef6ff;
    }
    .template-chip.active {
      border-style: solid;
      border-color: #6fa8ff;
      background: #e9f2ff;
      color: #1f5da6;
      font-weight: 700;
    }
    .custom-indicator-empty,
    .custom-indicator-feedback {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.35;
    }
    .custom-indicator-feedback.error {
      color: var(--red);
    }
    .position-meta {
      display: grid;
      gap: 2px;
      min-width: 0;
    }
    .position-meta strong,
    .position-meta span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .position-meta strong {
      font-size: 13px;
      line-height: 1.2;
    }
    .position-meta span {
      color: var(--muted);
      font-size: 12px;
    }
    .window-actions {
      display: flex;
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }
    .window-actions button {
      min-width: 62px;
      border: 0;
      border-right: 1px solid var(--line);
      background: transparent;
      color: var(--text);
      padding: 0 10px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .window-actions button:last-child { border-right: 0; }
    .window-actions button:disabled,
    .mini-button:disabled {
      color: #a7b1ba;
      cursor: not-allowed;
      background: #f8fafc;
    }
    .jump-control {
      min-width: 0;
    }
    .overlap-control {
      min-width: 0;
    }
    .position-control {
      min-width: 0;
    }
    .mini-button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .toolbar-button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      padding: 0 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex: 0 0 auto;
    }
    .toolbar-button:hover {
      border-color: #b8c7d6;
      background: #f8fafc;
    }
    .home-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 34px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--blue);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }
    .home-link:hover {
      border-color: #b8c7d6;
      background: #f8fafc;
    }
    .summary {
      display: grid;
      grid-template-columns: repeat(6, minmax(92px, 1fr));
      gap: 1px;
      border-bottom: 1px solid var(--line);
      background: var(--line);
    }
    .metric {
      min-width: 0;
      background: var(--surface);
      padding: 10px 14px;
    }
    .metric span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 16px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    main {
      padding: 14px 20px 20px;
      display: grid;
      gap: 6px;
      align-items: start;
    }
    .chart-shell {
      position: sticky;
      top: 12px;
      z-index: 5;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    #topChart {
      position: relative;
      z-index: 1;
      width: 100%;
      height: min(62vh, 680px);
      min-height: 460px;
      background: transparent;
      border: none;
      border-radius: 0;
    }
    .top-chart-hint { display: none; }
    .indicator-stack-shell {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .indicator-stack-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
    }
    .indicator-stack-title {
      display: grid;
      gap: 3px;
    }
    .indicator-stack-title strong {
      font-size: 13px;
      line-height: 1.2;
    }
    .indicator-stack-title span {
      color: var(--muted);
      font-size: 12px;
    }
    .indicator-panel-list {
      max-height: min(54vh, 760px);
      overflow-y: auto;
      padding: 6px 8px 8px;
      display: grid;
      gap: 8px;
    }
    .indicator-panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    .indicator-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfd;
      flex-wrap: nowrap;
    }
    .indicator-panel-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      flex: 0 0 auto;
    }
    .indicator-panel-select {
      min-width: 104px;
      max-width: 152px;
      height: 24px;
      padding: 2px 6px;
      font-size: 11px;
    }
    .indicator-panel-values {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      align-items: center;
      min-width: 0;
      justify-content: flex-end;
      overflow: hidden;
      white-space: nowrap;
    }
    .indicator-panel-controls .toolbar-button {
      min-height: 24px;
      padding: 0 8px;
      font-size: 11px;
      border-radius: 4px;
    }
    .indicator-panel-values .indicator-value {
      gap: 2px;
      padding: 0 2px;
      font-size: 10px;
    }
    .indicator-panel-values .indicator-value .number {
      font-size: 10px;
    }
    .indicator-chart {
      width: 100%;
      height: 220px;
    }
    .indicator-empty {
      padding: 24px 12px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }
    .indicator-value {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      gap: 3px;
      padding: 0 2px;
      border-radius: 2px;
      white-space: nowrap;
    }
    .indicator-value.hidden {
      opacity: 0.4;
    }
    .indicator-value .label {
      font-weight: 600;
    }
    .indicator-value .number {
      font-family: "SF Mono", "Monaco", "Consolas", monospace;
      font-size: 10px;
    }
    .indicator-value .arrow {
      font-size: 10px;
    }
    .arrow-up { color: var(--red); }
    .arrow-down { color: var(--green); }
    .empty {
      display: grid;
      place-items: center;
      min-height: 460px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 8px;
    }
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(31, 41, 51, 0.18);
      z-index: 20;
    }
    .drawer-backdrop[hidden] { display: none; }
    .data-drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 30;
      width: min(420px, 100vw);
      height: 100vh;
      background: var(--surface);
      border-left: 1px solid var(--line);
      box-shadow: -16px 0 32px rgba(31, 41, 51, 0.16);
      transform: translateX(100%);
      transition: transform 160ms ease;
      display: grid;
      grid-template-rows: auto 1fr;
    }
    .data-drawer.open {
      transform: translateX(0);
    }
    .drawer-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .drawer-header h2 {
      margin: 0;
      font-size: 16px;
      letter-spacing: 0;
    }
    .drawer-header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }
    .source-switcher {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 12px 0;
      background: #fbfcfd;
    }
    .source-switcher button {
      min-height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--muted);
      padding: 0 10px;
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .source-switcher button.active {
      border-color: #9dc5ff;
      background: #eef6ff;
      color: var(--blue);
    }
    .status-list {
      overflow: auto;
      padding: 12px;
      background: #fbfcfd;
    }
    .status-symbol-group {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .status-symbol-header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #f8fafc;
    }
    .status-symbol-header strong,
    .status-symbol-header small {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-symbol-header small {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .status-row {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      background: #fff;
      color: var(--text);
      padding: 10px;
      font: inherit;
      cursor: pointer;
    }
    .status-row:last-child { border-bottom: 0; }
    .status-row.active {
      border-color: #9dc5ff;
      background: #eef6ff;
    }
    .status-row strong,
    .status-row span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .status-row small {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.35;
    }
    .status-pill {
      align-self: start;
      border-radius: 999px;
      background: #edf2f7;
      color: var(--muted);
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 700;
    }
    @media (max-width: 1180px) {
      .time-window {
        grid-template-columns: minmax(120px, 170px) minmax(94px, 116px) auto minmax(170px, 1fr) auto;
      }
      .position-control {
        grid-column: 1 / -1;
      }
      .window-position {
        grid-template-columns: minmax(220px, 1fr) minmax(300px, 360px);
      }
    }
    @media (max-width: 980px) {
      .control-board,
      .control-symbol,
      .control-search,
      .control-frequency {
        max-width: none;
      }
      .time-window {
        grid-template-columns: minmax(120px, 170px) minmax(94px, 116px) minmax(180px, 1fr) auto;
      }
      .custom-indicator-form.open {
        grid-template-columns: 1fr;
      }
      .window-actions {
        grid-column: 3 / -1;
      }
      .jump-control {
        grid-column: 1 / -2;
      }
      .time-window .mini-button {
        grid-column: -2 / -1;
      }
      .position-control { grid-column: 1 / -1; }
      .summary { grid-template-columns: repeat(3, minmax(90px, 1fr)); }
      #topChart { height: 560px; }
    }
    @media (max-width: 620px) {
      .topbar-header {
        display: grid;
      }
      .header-actions {
        justify-items: start;
      }
      .control,
      .toolbar-button {
        flex-basis: 100%;
        max-width: none;
      }
      .time-window {
        grid-template-columns: 1fr;
      }
      .window-actions,
      .jump-control,
      .time-window .mini-button {
        grid-column: auto;
      }
      .window-actions button {
        flex: 1 1 0;
      }
      .summary { grid-template-columns: repeat(2, minmax(90px, 1fr)); }
      main { padding: 10px; }
      .topbar { padding: 12px; }
      .indicator-stack-header,
      .indicator-panel-header {
        display: grid;
      }
      .indicator-panel-values {
        justify-content: flex-start;
      }
      #topChart { min-height: 420px; }
    }
  </style>
</head>
<body>
  <script id="kline-payload" type="application/json">__KLINE_PAYLOAD__</script>
  <header class="topbar">
    <div class="topbar-header">
      <div class="title-block">
        <h1>K-line Cache Viewer</h1>
        <div class="subtitle" id="datasetMeta"></div>
      </div>
      <div class="header-actions">
        <a class="home-link" id="workbenchHomeLink" href="#" hidden>Workbench Home</a>
      </div>
    </div>
    <button type="button" class="data-status-button" id="dataStatusButton" aria-expanded="false">
      <strong>Data Status</strong>
      <span id="dataStatusStripMeta">Cached series</span>
    </button>
    <div class="controls">
      <label class="control control-board">Market / Board
        <select id="boardSelect"></select>
      </label>
      <label class="control control-symbol">Symbol
        <select id="symbolSelect"></select>
      </label>
      <label class="control control-search">Search
        <input id="searchInput" type="search" autocomplete="off" placeholder="Code or name">

    <div class="chart-shell">

    <section class="indicator-stack-shell" aria-label="Indicator stack">
      <section class="custom-indicator-panel compact" aria-label="Custom indicators">
        <div class="custom-indicator-header">
          <div class="custom-indicator-title">
            <strong>自定义指标</strong>
            <span>用收盘价、成交量或已有指标写公式，保存后即可在底部指标区下拉选择并展示。</span>

            <button type="button" class="toolbar-button" id="toggleCustomIndicatorForm">Add Custom Indicator</button>
          </div>
        </div>
        <div class="custom-indicator-form" id="customIndicatorForm">
          <label>名称
            <input id="customIndicatorNameInput" type="text" maxlength="24" autocomplete="off" placeholder="例如：MACD Spread">
          </label>
          <label><span class="formula-label">公式 <span class="formula-help" id="customFormulaHelp" aria-label="公式帮助">i</span></span>
            <textarea id="customIndicatorFormulaInput" spellcheck="false" placeholder="支持单行公式，或多行 alias = formula&#10;例如：spread = macd.dif - macd.dea&#10;signal = ema(&quot;spread&quot;, 5)"></textarea>

          <div class="custom-indicator-actions">
            <button type="button" class="toolbar-button" id="saveCustomIndicatorButton">Save</button>
            <button type="button" class="toolbar-button" id="cancelCustomIndicatorButton">Cancel</button>

      <div class="indicator-stack-header">
        <div class="indicator-stack-title">
          <strong>指标堆栈</strong>
          <span>默认指标和自定义指标会在下方持续叠加，滚动区域单独查看。</span>
        </div>
        <button type="button" class="toolbar-button" id="addIndicatorPanelButton">Add Indicator Panel</button>

      <div class="indicator-panel-list" id="indicatorPanelList"></div>
